<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inicio de sesión | BioAccess</title>
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/login.css">
</head>
<body>

<div class="login-wrapper">
    <div class="bg-navy"></div>
  <div class="bg-accent"></div>

  <!-- ================= Panel izquierdo: marca ================= -->
  <div class="login-brand">

    <div class="brand-logo">
  <img src="assets/logo-inpec.png" alt="Logo INPEC">
</div>

    <div class="brand-title">
      <h1>SISTEMA DE CONTROL<br><span>DE ACCESO</span></h1>
      <p>AUTENTICACIÓN BIOMÉTRICA</p>
    </div>

    <div class="brand-divider"></div>

    <div class="brand-project">
  <img src="assets/logo-jzpam.jpeg" alt="Logo JZPAM">
</div>

    <div class="brand-devs">
      <strong>JUAN CAMILO ZAPATA</strong>
      <strong>ASTRID MADRIGAL TORRES</strong>
      <strong>JUAN PABLO PEREZ</strong>
      <div class="label">DESARROLLADORES</div>
    </div>

    <div class="brand-fingerprint">
  <img src="assets/logo-huella.png" alt="Huella digital">
 </div>

  </div>

  <!-- ================= Panel derecho: formulario ================= -->
  <div class="login-form-side">
    <div class="login-card">

      <div class="login-card-icon">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <circle cx="12" cy="8" r="4"/>
          <path d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7v1H4v-1z"/>
        </svg>
      </div>

      <h2>INICIO DE SESIÓN</h2>
      <p class="subtitle">Ingrese sus credenciales para continuar</p>

      <form action="registro.html" method="get">

        <div class="field">
          <svg class="leading" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8" r="4"/>
            <path d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7"/>
          </svg>
          <input type="text" placeholder="Usuario" required>
        </div>

        <div class="field">
          <svg class="leading" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="10" width="16" height="10" rx="2"/>
            <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
          </svg>
          <input type="password" id="password" placeholder="Contraseña" required>
          <button type="button" class="toggle-eye" onclick="togglePassword()" aria-label="Mostrar contraseña">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="eyeIcon">
              <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>

        <label class="remember-row">
          <input type="checkbox" checked>
          Recordar usuario
        </label>

        <button type="submit" class="btn-primary">
          <svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="9" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="white" stroke-width="2"/></svg>
          INGRESAR
        </button>

      </form>

      <div class="divider-row">o</div>

      <button type="button" class="btn-secondary" onclick="window.location.href='registro.html'">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round">
          <path d="M12 2a7 7 0 0 0-7 7c0 4 1 6 1 9"/>
          <path d="M12 2a7 7 0 0 1 7 7c0 3 .3 5-1 8"/>
          <path d="M9 5.5a6 6 0 0 1 6 0"/>
          <path d="M6 6.5C6 6.5 4.5 8 4.5 11c0 3.5 1 5 1 7.5"/>
        </svg>
        INGRESO BIOMÉTRICO
      </button>

      <p class="login-footer">© 2026 INPEC — Todos los derechos reservados</p>

    </div>
  </div>

</div>

<script>
  function togglePassword() {
    const input = document.getElementById('password');
    input.type = input.type === 'password' ? 'text' : 'password';
  }
</script>

</body>
</html>
